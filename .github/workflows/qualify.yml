name: Qualify native media foundation
on:
  push:
    branches: [main, feature/native-media-foundation]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: media-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lock:
    name: Verify committed source and dependency lock
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      ready: ${{ steps.metadata.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install exact supported compiler
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
      - name: Resolve only on the hosted runner
        id: metadata
        run: |
          mkdir -p artifacts/lock
          git rev-parse HEAD > artifacts/lock/source-commit.txt
          rustc -vV > artifacts/lock/compiler.txt
          ready=true
          if ! cargo metadata --locked --all-features --format-version 1 > artifacts/lock/metadata.json 2> artifacts/lock/check.log; then
            cargo metadata --all-features --format-version 1 > artifacts/lock/metadata.json 2> artifacts/lock/resolve.log
            ready=false
          fi
          cp Cargo.lock artifacts/lock/Cargo.lock
          echo "$ready" > artifacts/lock/committed-lock-ready.txt
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: media-lock-${{ github.sha }}
          path: artifacts/lock
          retention-days: 14
      - name: Require reviewed committed lock before qualification
        if: steps.metadata.outputs.ready != 'true'
        run: |
          echo '::error::Review and commit the hosted resolved Cargo.lock before qualification.'
          exit 1
  verify:
    name: Native providers and texture adapter (${{ matrix.os }})
    needs: lock
    if: needs.lock.outputs.ready == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install supported checks
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.95.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: media-${{ runner.os }}-${{ runner.arch }}-1.95-${{ hashFiles('Cargo.lock') }}
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test actual providers and native texture contracts
        run: cargo test --workspace --all-features --locked
      - name: Test the minimal immutable-input boundary
        run: cargo test -p craft-media-preview --no-default-features --locked
      - name: Strict Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Retain an unchanged reviewed dependency lock
        run: git diff --exit-code -- Cargo.lock
